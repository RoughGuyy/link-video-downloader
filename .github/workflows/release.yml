name: build-desktop-apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LinkVideoDownloader --distpath release
          --workpath build/pyinstaller --specpath build
          --collect-all yt_dlp --collect-all imageio_ffmpeg launcher_gui.py
      - name: Rename Windows application
        shell: pwsh
        run: Move-Item release/LinkVideoDownloader.exe release/LinkVideoDownloader-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideoDownloader-Windows-x64
          path: release/LinkVideoDownloader-Windows-x64.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python-architecture: arm64
            asset-suffix: Apple-Silicon
          - runner: macos-15-intel
            python-architecture: x64
            asset-suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}
          cache: pip
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - name: Build macOS application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LinkVideoDownloader --distpath release
          --workpath build/pyinstaller --specpath build
          --osx-bundle-identifier com.roughguyy.linkvideodownloader
          --collect-all yt_dlp --collect-all imageio_ffmpeg launcher_gui.py
      - name: Verify and package application
        run: |
          codesign --force --deep --sign - release/LinkVideoDownloader.app
          codesign --verify --deep --strict release/LinkVideoDownloader.app
          file release/LinkVideoDownloader.app/Contents/MacOS/LinkVideoDownloader
          ditto -c -k --sequesterRsrc --keepParent release/LinkVideoDownloader.app "release/LinkVideoDownloader-macOS-${{ matrix.asset-suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideoDownloader-macOS-${{ matrix.asset-suffix }}
          path: release/LinkVideoDownloader-macOS-${{ matrix.asset-suffix }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LinkVideoDownloader-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --title "Link Video Downloader ${{ github.ref_name }}"
          --generate-notes
