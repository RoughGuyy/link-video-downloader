[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "link-video-downloader"
version = "0.5.0"
description = "Download public videos from Xiaohongshu, Bilibili, and YouTube with one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RoughGuyy" }]
keywords = ["video", "downloader", "xiaohongshu", "bilibili", "youtube", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "imageio-ffmpeg>=0.6,<1",
  "requests>=2.31,<3",
  "yt-dlp>=2025.1.15",
]

[project.scripts]
linkvideo = "linkvideo.cli:main"
linkvideo-gui = "linkvideo.gui:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.urls]
Homepage = "https://github.com/RoughGuyy/link-video-downloader"
Issues = "https://github.com/RoughGuyy/link-video-downloader/issues"

[tool.setuptools.packages.find]
where = ["src"]
